framework:
  name: AgentFlow
  version: "1.3.0"

project:
  name: "<project-name>"
  namespace: "<stable-project-namespace>"
  process: AGENTFLOW
  legacy_transition: false
  compatible_framework: ">=1.3.0,<2.0.0"
  delivery_model: "<git|artifact|low-code|saas-config|other>"
  last_validated: "<YYYY-MM-DD>"
  validated_framework_version: "1.3.0"

records:
  system: "<issue-tracker|change-system|other>"
  artifact_id_mapping: "<native-id-rule-or-AgentFlow-pattern>"
  durable_approval_location: "<reference>"
  stage_result_location: "<reference>"
  analysis_checkpoint_location: "<same-as-stage-result-or-reference>"
  review_record_location: "<reference>"
  candidate_manifest_location: "<reference>"

approval:
  owner_model: single_owner
  tokens:
    bootstrap: "APPROVE_AGENTFLOW_BOOTSTRAP"
    requirement: "APPROVE_REQUIREMENT"
    transfer: "APPROVE_TRANSFER"
    architecture: "APPROVE_ARCHITECTURE"
    task_contract: "APPROVE_TASK_CONTRACT"
    prod_data_use: "APPROVE_PROD_DATA_USE"
    forward_fix: "APPROVE_FORWARD_FIX"
    prod: "PROD_GO"

gates:
  bootstrap_activation_required: true
  requirement_approval_required: true
  transfer_required: false
  architecture_gate_on_trigger: true
  task_contract_approval_required: true
  evidence_required: true
  independent_review_required: true
  dev_verification_required: true
  candidate_manifest_required: true
  independent_test_required: true
  prod_go_required: true
  prod_smoke_required: true

architecture:
  project_triggers: []

environments:
  dev: "<dev-environment>"
  test: "<test-environment>"
  prod: "<prod-environment>"

access:
  by_phase:
    requirements: {environments: [], credential_role: "<read-or-none>", prod_mutation: false}
    architecture: {environments: [], credential_role: "<read-or-none>", prod_mutation: false}
    development_analysis: {environments: ["<dev-read>"], credential_role: "<read-role>", prod_mutation: false}
    implementation: {environments: ["<dev>"], credential_role: "<executor-role>", prod_mutation: false}
    evidence: {environments: ["<dev-read>"], credential_role: "<evidence-read-role>", prod_mutation: false}
    review: {environments: ["<dev-read>"], credential_role: "<review-read-role>", prod_mutation: false}
    test: {environments: ["<test>"], credential_role: "<test-role>", prod_mutation: false}
    prod_deploy: {environments: ["<prod>"], credential_role: "<prod-deploy-role>", prod_mutation: true}

execution:
  default_retry_limit: 2
  remediation_cycle_budget: 2
  single_active_executor_per_atc: true
  handoff_record_required: true
  context:
    primary_measure: characters
    normal_estimated_token_target: 5000
    stretch_estimated_token_target: 3000
    full_document_reads_exceptional: true
    source_code_exploration_separate: true

evidence:
  mandatory_check_policy: ARTIFACT_OR_REPRODUCIBLE
  # ARTIFACT_OR_REPRODUCIBLE | ARTIFACT_REQUIRED | REPRODUCIBLE_REQUIRED | BOTH_REQUIRED
  stable_reference_preferred: true
  context_telemetry_required: true

review:
  independence_level: IR1_FRESH_CONTEXT
  candidate_binding_required: true
  durable_record_location: "<reference>"
  external_reviewer_write_scope: review_records_only
  implementation_mutation_allowed: false

release:
  candidate_identity: "<commit_sha|artifact_hash|snapshot_id|other>"
  candidate_manifest_required: true
  environment_transition_readiness_required: true
  rollback_required_before_prod: true
  explicit_prod_go_required: true
  exact_candidate_promotion_required: true
  forward_fix:
    enabled: true
    explicit_approval_required: true
    reconciliation_required: true

data_handling:
  production_data_in_nonprod:
    allowed_by_default: false
    explicit_approval_required: true
    minimisation_or_anonymisation_required: true
    retention_condition_required: true

revalidation:
  triggers:
    - environment_topology_change
    - source_control_or_change_system_change
    - ci_cd_or_deployment_change
    - owner_or_approval_model_change
    - approval_record_location_change
    - stage_or_checkpoint_record_location_change
    - candidate_identity_mechanism_change
    - phase_access_boundary_change
    - evidence_or_review_policy_change
    - incompatible_framework_version
  gaps_require_owner: true
  gaps_require_closure_condition: true

metrics:
  catalogue: "METRICS.md"
  collection: "<manual|project-specific-tooling|none>"
  controlled_context_separate_from_source_exploration: true

documentation:
  architecture: "<path-or-system>"
  requirements: "<path-or-system>"
  contracts: "<path-or-system>"
